    <main id="conteudo">
        <div id="cabecalho-guia">
            <h1>Guia Turístico</h1>
            <p id="sub-guia">Monte sua rota personalizada por Toledo</p>
        </div>

        <section id="wizard">
            <div class="filtro-grupo">
                <div class="filtro-label">⏱ Tempo disponível</div>
                <div class="chips" data-grupo="tempo">
                    <button class="chip" data-valor="2h">2 horas</button>
                    <button class="chip ativo" data-valor="meio">Meio dia</button>
                    <button class="chip" data-valor="dia">Dia inteiro</button>
                </div>
            </div>
            <div class="filtro-grupo">
                <div class="filtro-label">👥 Perfil</div>
                <div class="chips" data-grupo="perfil">
                    <button class="chip" data-valor="familia">👨‍👩‍👧 Família</button>
                    <button class="chip ativo" data-valor="casal">💑 Casal</button>
                    <button class="chip" data-valor="amigos">👥 Amigos</button>
                    <button class="chip" data-valor="solo">🧍 Solo</button>
                </div>
            </div>
            <div class="filtro-grupo">
                <div class="filtro-label">❤️ Interesse</div>
                <div class="chips" data-grupo="interesse">
                    <button class="chip ativo" data-valor="gastro">🍽️ Gastronomia</button>
                    <button class="chip" data-valor="cultura">🎭 Cultura</button>
                    <button class="chip" data-valor="natureza">🌿 Natureza</button>
                    <button class="chip" data-valor="cafe">☕ Café & Doces</button>
                    <button class="chip" data-valor="noite">🍺 Vida noturna</button>
                </div>
            </div>
            <div class="filtro-grupo">
                <div class="filtro-label">💰 Orçamento</div>
                <div class="chips" data-grupo="orcamento">
                    <button class="chip" data-valor="gratis">✓ Gratuito</button>
                    <button class="chip ativo" data-valor="eco">$ Econômico</button>
                    <button class="chip" data-valor="prem">$$ Premium</button>
                </div>
            </div>
            <div class="filtro-grupo">
                <div class="filtro-label">⚡ Ritmo do passeio</div>
                <div class="chips" data-grupo="ritmo">
                    <button class="chip ativo" data-valor="qualquer">Qualquer</button>
                    <button class="chip" data-valor="leve">🌿 Tranquilo</button>
                    <button class="chip" data-valor="moderado">🔎 Equilibrado</button>
                    <button class="chip" data-valor="animado">🎶 Animado</button>
                </div>
            </div>
            <div class="filtro-grupo">
                <div class="filtro-label">☀️ Melhor momento</div>
                <div class="chips" data-grupo="momento">
                    <button class="chip ativo" data-valor="qualquer">Qualquer horário</button>
                    <button class="chip" data-valor="manha">🌤️ Manhã</button>
                    <button class="chip" data-valor="tarde">🌇 Tarde</button>
                    <button class="chip" data-valor="noite">🌙 Noite</button>
                </div>
            </div>
            <button id="btn-gerar">Gerar rotas ↗</button>
        </section>

        <div id="aviso-eventos" class="oculto">
            <span>🎉</span>
            <span id="texto-eventos"></span>
            <a href="eventos.html">Ver todos os eventos →</a>
        </div>

        <div id="layout-resultado" class="oculto">
            <aside id="col-rotas">
                <h3 class="col-titulo">Rotas sugeridas</h3>
                <div id="lista-rotas"></div>
            </aside>

            <div id="col-mapa">
                <div id="mapa-guia"></div>
                <div id="trans-btns">
                    <button class="trans-btn ativo" data-trans="car">🚗 Carro</button>
                    <button class="trans-btn" data-trans="walk">🚶 A pé</button>
                </div>
                <div id="paradas-container">
                    <div id="paradas-titulo"></div>
                    <div id="paradas-lista"></div>
                </div>
            </div>
        </div>

        <div id="estado-inicial">
            <div id="estado-icone">🗺️</div>
            <p>Preencha suas preferências acima e clique em <strong>Gerar rotas</strong></p>
        </div>
    </main>
