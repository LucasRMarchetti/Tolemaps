    <main id="conteudo" class="bai-jamjuree-regular">
        <div class="container-autenticacao">
            <div class="cabecalho-autenticacao">
                <h1>Bem-vindo ao Tolemaps</h1>
                <p>Crie sua conta ou faça login</p>
            </div>

            <div class="abas-autenticacao">
                <button class="aba active" data-aba="login">Entrar</button>
                <button class="aba" data-aba="cadastro">Cadastrar</button>
            </div>

            <div class="conteudo-autenticacao">
                <form id="formularioLogin" class="formulario-autenticacao active">
                    <div class="grupo-formulario">
                        <label class="rotulo-formulario">E-mail</label>
                        <input type="email" id="emailLogin" class="entrada-formulario" required placeholder="seu@email.com">
                    </div>
                    <div class="grupo-formulario">
                        <label class="rotulo-formulario">Senha</label>
                        <div class="container-senha">
                            <input type="password" id="senhaLogin" class="entrada-formulario" required placeholder="Sua senha">
                            <button type="button" class="alternar-senha" data-alvo="senhaLogin">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="botao botao-principal">Entrar na Conta</button>
                    <div id="mensagemLogin" class="mensagem" role="status" aria-live="polite"></div>
                </form>

                <form id="formularioCadastro" class="formulario-autenticacao">
                    <div class="grupo-formulario">
                        <label class="rotulo-formulario">Nome completo</label>
                        <input type="text" name="nome" id="nomeCompleto" class="entrada-formulario" required placeholder="Seu nome completo">
                    </div>
                    <div class="grupo-formulario">
                        <label class="rotulo-formulario">E-mail</label>
                        <input type="email" name="email" id="emailCadastro" class="entrada-formulario" required placeholder="seu@email.com">
                    </div>
                    <div class="grupo-formulario">
                        <label class="rotulo-formulario">Senha</label>
                        <div class="container-senha">
                            <input type="password" name="senha" id="senhaCadastro" class="entrada-formulario" minlength="6" required placeholder="Mínimo 6 caracteres">
                            <button type="button" class="alternar-senha" data-alvo="senhaCadastro">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="grupo-formulario">
                        <label class="rotulo-formulario">Confirmar senha</label>
                        <div class="container-senha">
                            <input type="password" id="confirmarSenha" class="entrada-formulario" minlength="6" required placeholder="Digite novamente sua senha">
                            <button type="button" class="alternar-senha" data-alvo="confirmarSenha">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="grupo-formulario">
                        <label class="rotulo-formulario">Tipo de conta</label>
                        <select id="tipoConta" name="tipo" class="entrada-formulario entrada-selecao">
                            <option value="usuario">Usuário</option>
                            <option value="proprietario">Proprietário</option>
                            <option value="admin">Administrador</option>
                            <option value="moderador">Moderador</option>
                        </select>
                    </div>
                    <div id="linhaChaveMestre" class="grupo-formulario oculto">
                        <label class="rotulo-formulario">Chave mestre</label>
                        <input type="text" id="chaveMestre" class="entrada-formulario" placeholder="Digite a chave mestre">
                        <small class="aviso">Apenas para desenvolvimento</small>
                    </div>
                    <button type="submit" class="botao botao-principal">Criar Nova Conta</button>
                    <div id="mensagemCadastro" class="mensagem" role="status" aria-live="polite"></div>
                </form>
            </div>
        </div>
    </main>
